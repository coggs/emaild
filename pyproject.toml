[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emaild"
version = "0.0.1"
description = "emAIl - an AI-managed email harness (Phase 0)"
requires-python = ">=3.12"
dependencies = [
  "oracledb>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "mcp>=1.10,<2",  # v2 renamed FastMCP to MCPServer; migrate later
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "cryptography>=42",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emaild = "emaild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emaild = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
